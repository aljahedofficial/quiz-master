<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>quiz-master | AI PDF Quiz Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg-a: #0f172a;
        --bg-b: #1d4ed8;
        --card: rgba(255, 255, 255, 0.18);
        --border: rgba(255, 255, 255, 0.35);
        --text: #f8fafc;
        --muted: #dbeafe;
        --success: #16a34a;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 10%, #2563eb 0, transparent 45%),
          radial-gradient(circle at 80% 80%, #0ea5e9 0, transparent 35%),
          linear-gradient(135deg, var(--bg-a), var(--bg-b));
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .app {
        width: min(920px, 100%);
      }

      .glass {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 25px 55px rgba(15, 23, 42, 0.28);
      }

      .panel {
        padding: 1.35rem;
      }

      h1 {
        margin: 0 0 0.45rem;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      .subtitle {
        margin: 0 0 1.2rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .grid {
        display: grid;
        gap: 0.95rem;
        grid-template-columns: repeat(12, minmax(0, 1fr));
      }

      .field {
        grid-column: span 12;
      }

      @media (min-width: 720px) {
        .field.subject,
        .field.language {
          grid-column: span 6;
        }
      }

      label {
        display: block;
        margin-bottom: 0.45rem;
        font-weight: 600;
      }

      input,
      select,
      button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 0.72rem 0.84rem;
        font: inherit;
      }

      input,
      select {
        color: #0f172a;
        background: rgba(248, 250, 252, 0.95);
      }

      button {
        cursor: pointer;
        border: none;
        font-weight: 700;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .primary {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
      }

      .secondary {
        background: rgba(255, 255, 255, 0.18);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.35);
      }

      .danger {
        background: rgba(220, 38, 38, 0.25);
        color: #fee2e2;
      }

      .actions {
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
      }

      .actions button {
        flex: 1;
      }

      .status {
        margin-top: 1rem;
        border-radius: 12px;
        padding: 0.85rem;
        background: rgba(15, 23, 42, 0.35);
        min-height: 3rem;
      }

      .error {
        color: #fecaca;
      }

      .loading {
        display: inline-flex;
        gap: 0.45rem;
        align-items: center;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: white;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .quiz {
        margin-top: 1rem;
      }

      .hidden {
        display: none !important;
      }

      .meter {
        display: flex;
        justify-content: space-between;
        margin-bottom: 1rem;
        color: var(--muted);
        font-weight: 600;
      }

      .question-card {
        padding: 1rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.35);
      }

      .question {
        margin: 0 0 1rem;
        line-height: 1.45;
      }

      .options {
        display: grid;
        gap: 0.65rem;
      }

      .option {
        text-align: left;
        color: #0f172a;
        background: #f8fafc;
        border: 2px solid transparent;
      }

      .option.correct {
        background: #dcfce7;
        border-color: #16a34a;
        color: #166534;
      }

      .option.wrong {
        background: #fee2e2;
        border-color: #dc2626;
        color: #991b1b;
      }

      .feedback {
        margin-top: 0.85rem;
        font-weight: 600;
      }

      .explanation {
        margin-top: 0.65rem;
        padding: 0.7rem;
        border-left: 4px solid #60a5fa;
        border-radius: 10px;
        background: rgba(148, 163, 184, 0.2);
      }

      .summary {
        margin-top: 1rem;
        text-align: center;
        padding: 1.4rem;
      }

      .summary strong {
        font-size: 1.65rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="glass panel" aria-labelledby="title">
        <h1 id="title">quiz-master</h1>
        <p class="subtitle">Upload a PDF, choose subject/language, and generate a 10-question AI quiz instantly.</p>

        <form id="generatorForm" novalidate>
          <div class="grid">
            <div class="field">
              <label for="pdfFile">PDF file</label>
              <input id="pdfFile" name="pdfFile" type="file" accept="application/pdf" required />
            </div>

            <div class="field subject">
              <label for="subject">Subject</label>
              <input id="subject" name="subject" type="text" value="General Knowledge" maxlength="80" required />
            </div>

            <div class="field language">
              <label for="language">Language</label>
              <select id="language" name="language" required>
                <option value="English">English</option>
                <option value="Arabic">Arabic</option>
                <option value="Bangla">Bangla</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
              </select>
            </div>
          </div>

          <div class="actions" style="margin-top: 0.9rem;">
            <button id="generateBtn" class="primary" type="submit">Generate Quiz</button>
            <button id="cancelBtn" class="danger hidden" type="button">Cancel</button>
          </div>
        </form>

        <div id="status" class="status" role="status" aria-live="polite">Ready to generate your quiz.</div>

        <section id="quizSection" class="quiz hidden" aria-live="polite">
          <div class="meter">
            <span id="progressText"></span>
            <span id="scoreText"></span>
          </div>
          <article class="question-card">
            <h2 id="questionText" class="question"></h2>
            <div id="options" class="options"></div>
            <p id="feedback" class="feedback"></p>
            <button id="toggleExplanationBtn" class="secondary hidden" type="button">Show explanation</button>
            <div id="explanation" class="explanation hidden"></div>
            <button id="nextBtn" class="primary hidden" type="button" style="margin-top: 0.9rem;"></button>
          </article>
        </section>

        <section id="summarySection" class="summary glass hidden" aria-live="polite">
          <h2>Quiz finished</h2>
          <p id="finalSummary"></p>
          <button id="restartBtn" class="primary" type="button">Start over</button>
        </section>
      </section>
    </main>

    <script>
      (function () {
        const MAX_FILE_BYTES = 10 * 1024 * 1024;
        const state = {
          loading: false,
          controller: null,
          questions: [],
          currentIndex: 0,
          score: 0,
          selectedAnswer: null,
          revealed: false
        };

        const ui = {
          form: document.getElementById('generatorForm'),
          file: document.getElementById('pdfFile'),
          subject: document.getElementById('subject'),
          language: document.getElementById('language'),
          status: document.getElementById('status'),
          generate: document.getElementById('generateBtn'),
          cancel: document.getElementById('cancelBtn'),
          quiz: document.getElementById('quizSection'),
          progress: document.getElementById('progressText'),
          score: document.getElementById('scoreText'),
          question: document.getElementById('questionText'),
          options: document.getElementById('options'),
          feedback: document.getElementById('feedback'),
          toggleExplanation: document.getElementById('toggleExplanationBtn'),
          explanation: document.getElementById('explanation'),
          next: document.getElementById('nextBtn'),
          summary: document.getElementById('summarySection'),
          finalSummary: document.getElementById('finalSummary'),
          restart: document.getElementById('restartBtn')
        };

        function setStatus(message, isError) {
          ui.status.classList.toggle('error', Boolean(isError));
          ui.status.textContent = message;
        }

        function setLoading(isLoading) {
          state.loading = isLoading;
          ui.generate.disabled = isLoading;
          ui.cancel.classList.toggle('hidden', !isLoading);

          if (isLoading) {
            setStatus('Generating quiz. This can take a few seconds.', false);
            ui.status.innerHTML = '<span class="loading"><span class="spinner" aria-hidden="true"></span>Generating quiz. This can take a few seconds.</span>';
          }
        }

        function normalizeQuestions(payload) {
          if (!payload || !Array.isArray(payload.questions)) {
            return null;
          }

          return payload.questions.map((item) => ({
            question: typeof item.question === 'string' ? item.question : '',
            options: Array.isArray(item.options) ? item.options : [],
            answerIndex: Number(item.answerIndex),
            explanation: typeof item.explanation === 'string' ? item.explanation : ''
          }));
        }

        function resetQuizState() {
          state.questions = [];
          state.currentIndex = 0;
          state.score = 0;
          state.selectedAnswer = null;
          state.revealed = false;
          ui.quiz.classList.add('hidden');
          ui.summary.classList.add('hidden');
          ui.options.innerHTML = '';
          ui.feedback.textContent = '';
          ui.explanation.textContent = '';
          ui.explanation.classList.add('hidden');
          ui.toggleExplanation.classList.add('hidden');
          ui.next.classList.add('hidden');
        }

        function renderQuestion() {
          const question = state.questions[state.currentIndex];
          if (!question) {
            return;
          }

          state.selectedAnswer = null;
          state.revealed = false;

          ui.progress.textContent = `Question ${state.currentIndex + 1} / ${state.questions.length}`;
          ui.score.textContent = `Score: ${state.score}`;
          ui.question.textContent = question.question;
          ui.options.innerHTML = '';
          ui.feedback.textContent = '';
          ui.explanation.textContent = question.explanation;
          ui.explanation.classList.add('hidden');
          ui.toggleExplanation.textContent = 'Show explanation';
          ui.toggleExplanation.classList.add('hidden');
          ui.next.classList.add('hidden');

          question.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option';
            btn.textContent = option;
            btn.setAttribute('aria-label', `Option ${index + 1}: ${option}`);
            btn.addEventListener('click', function () {
              if (state.revealed) {
                return;
              }

              state.revealed = true;
              state.selectedAnswer = index;

              const allButtons = Array.from(ui.options.querySelectorAll('button'));
              allButtons.forEach((b) => {
                b.disabled = true;
              });

              const isCorrect = index === question.answerIndex;
              if (isCorrect) {
                state.score += 1;
                btn.classList.add('correct');
                ui.feedback.textContent = '✅ Correct answer!';
                ui.feedback.style.color = 'var(--success)';
              } else {
                btn.classList.add('wrong');
                const correctBtn = allButtons[question.answerIndex];
                if (correctBtn) {
                  correctBtn.classList.add('correct');
                }
                ui.feedback.textContent = '❌ Incorrect. The highlighted option is correct.';
                ui.feedback.style.color = 'var(--danger)';
              }

              ui.score.textContent = `Score: ${state.score}`;
              ui.toggleExplanation.classList.remove('hidden');
              ui.next.textContent = state.currentIndex === state.questions.length - 1 ? 'Finish Quiz' : 'Next Question';
              ui.next.classList.remove('hidden');
              ui.next.focus();
            });

            ui.options.appendChild(btn);
          });
        }

        async function generateQuiz(event) {
          event.preventDefault();

          if (state.loading) {
            return;
          }

          const file = ui.file.files && ui.file.files[0];
          const subject = ui.subject.value.trim() || 'General Knowledge';
          const language = ui.language.value;

          if (!file) {
            setStatus('Please choose a PDF file before generating.', true);
            ui.file.focus();
            return;
          }

          if (file.type !== 'application/pdf') {
            setStatus('Only PDF files are supported.', true);
            return;
          }

          if (file.size > MAX_FILE_BYTES) {
            setStatus('PDF is too large. Please upload a file up to 10MB.', true);
            return;
          }

          resetQuizState();
          setLoading(true);
          state.controller = new AbortController();

          try {
            const response = await fetch('/api/generate', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/pdf',
                'x-subject': subject,
                'x-language': language
              },
              body: file,
              signal: state.controller.signal
            });

            const text = await response.text();
            let data;
            try {
              data = text ? JSON.parse(text) : {};
            } catch (jsonError) {
              throw new Error('Server returned an invalid JSON response. Please retry.');
            }

            if (!response.ok || !data.success) {
              const errorMessage = data && data.error ? data.error : 'Quiz generation failed.';
              const details = data && data.details ? ` (${data.details})` : '';
              throw new Error(errorMessage + details);
            }

            const questions = normalizeQuestions(data);
            const validSchema =
              Array.isArray(questions) &&
              questions.length === 10 &&
              questions.every((q) =>
                typeof q.question === 'string' &&
                q.question.trim() &&
                Array.isArray(q.options) &&
                q.options.length === 4 &&
                q.options.every((opt) => typeof opt === 'string' && opt.trim()) &&
                Number.isInteger(q.answerIndex) &&
                q.answerIndex >= 0 &&
                q.answerIndex <= 3
              );

            if (!validSchema) {
              throw new Error('Server returned quiz data in an unexpected format. Please retry.');
            }

            state.questions = questions;
            ui.quiz.classList.remove('hidden');
            setStatus('Quiz generated successfully. Good luck!', false);
            renderQuestion();
          } catch (error) {
            if (error.name === 'AbortError') {
              setStatus('Generation cancelled. You can adjust inputs and retry.', true);
            } else {
              setStatus(error.message || 'Unexpected error occurred while generating quiz.', true);
            }
          } finally {
            state.controller = null;
            setLoading(false);
          }
        }

        function goNext() {
          if (!state.revealed) {
            return;
          }

          if (state.currentIndex < state.questions.length - 1) {
            state.currentIndex += 1;
            renderQuestion();
            return;
          }

          const total = state.questions.length;
          const percentage = Math.round((state.score / total) * 100);
          ui.quiz.classList.add('hidden');
          ui.summary.classList.remove('hidden');
          ui.finalSummary.innerHTML = `You scored <strong>${state.score}/${total}</strong> (${percentage}%).`;
          setStatus('Quiz completed!', false);
        }

        function toggleExplanation() {
          if (ui.explanation.classList.contains('hidden')) {
            ui.explanation.classList.remove('hidden');
            ui.toggleExplanation.textContent = 'Hide explanation';
          } else {
            ui.explanation.classList.add('hidden');
            ui.toggleExplanation.textContent = 'Show explanation';
          }
        }

        function cancelRequest() {
          if (state.controller) {
            state.controller.abort();
          }
        }

        function restart() {
          resetQuizState();
          ui.form.reset();
          ui.subject.value = 'General Knowledge';
          ui.language.value = 'English';
          setStatus('Ready to generate your quiz.', false);
          ui.generate.focus();
        }

        ui.form.addEventListener('submit', generateQuiz);
        ui.cancel.addEventListener('click', cancelRequest);
        ui.next.addEventListener('click', goNext);
        ui.toggleExplanation.addEventListener('click', toggleExplanation);
        ui.restart.addEventListener('click', restart);
      })();
    </script>
  </body>
</html>
